[package]
name = "flexweek-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.42", default-features = false }
hex = "0.4.3"
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip", "arbitrary_precision", "preserve_order"] }
sha2 = "0.10.9"

[dev-dependencies]
serde_json = { version = "1.0.145", features = ["float_roundtrip", "arbitrary_precision", "preserve_order"] }
