name: Release packages

# Builds the Windows installers and the Linux downloads (Nuitka can only build
# for the OS it runs on) and attaches them to the GitHub release. Fires when a
# release is published; runnable by hand against an existing tag. Pull requests
# that touch packaging, and a hand run without a tag, build and test everything
# but upload nothing to a release; the Windows installers are kept as run artifacts.
#
# onedir (not onefile): Qt plugins ship as a folder, so each bundle is a
# directory, installed on Windows and inside a tar.gz or AppImage on Linux.
# The window is native Qt widgets. Chromium is not in the package.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach packages to (e.g. v0.9.2). Leave empty to build this branch without uploading."
        required: false
  pull_request:
    paths:
      - "packaging/**"
      - "desktop/build_windows.ps1"
      - "desktop/build_linux.sh"
      - "desktop/package_linux.sh"
      - ".github/workflows/release-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create venv and install build + runtime deps
        # build_windows.ps1 insists on .venv\Scripts\python.exe (DESKTOP.md §9),
        # so the deps go into a fresh venv, not the runner's system Python.
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt

      - name: Install Rust and build the engine module
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          .venv\Scripts\python -m maturin develop --release --manifest-path engine/py/Cargo.toml
        shell: pwsh

      - name: Build Windows onedir package
        # -AssumeYesForDownloads lets Nuitka fetch dependency walker (required
        # for Windows standalone mode); a prompt would hang the runner.
        run: ./desktop/build_windows.ps1 -AssumeYesForDownloads
        shell: pwsh

      - name: Smoke-test package layout and the setup Solve
        # GUI-subsystem freezes do not set $LASTEXITCODE under `&`. Start-Process
        # -Wait reads the process exit code.
        # --smoke-test walks a new account through setup to its first Solve and
        # fails on a blank window, which is how 0.9.0 broke for testers.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $root = "dist\FlexWeek-Windows"
          $exe = Join-Path $root "FlexWeek.exe"
          if (-not (Test-Path $exe)) { throw "FlexWeek.exe missing after build" }
          foreach ($name in @("README.txt", "LICENSE.txt", "flexweek.png")) {
            if (-not (Test-Path (Join-Path $root $name))) { throw "$name missing under $root" }
          }
          if (Get-ChildItem -Path $root -Recurse -Filter "*WebEngineCore*" -ErrorAction SilentlyContinue) {
            throw "Native package must not ship WebEngine"
          }
          if (Get-ChildItem -Path $root -Recurse -Filter "QtWebEngineProcess.exe" -ErrorAction SilentlyContinue) {
            throw "Native package must not ship QtWebEngineProcess.exe"
          }
          $report = Join-Path (Get-Location) "dist\windows-smoke.json"
          $proc = Start-Process -FilePath $exe -ArgumentList "--smoke-test",$report -WorkingDirectory $root -PassThru -Wait
          if (Test-Path $report) { Get-Content $report }
          if ($null -eq $proc.ExitCode -or $proc.ExitCode -ne 0) {
            throw "FlexWeek --smoke-test failed with $($proc.ExitCode)"
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.stage -ne "week shown after setup Solve") {
            throw "FlexWeek --smoke-test stopped at: $($result.stage)"
          }
        shell: pwsh

      - name: Install the installer tools
        # Inno Setup is not on windows-latest (Server 2025), so fetch the pinned
        # release and check it against the SHA-256 GitHub lists for it. WiX stays
        # on v6: v7 blocks every command until its EULA is accepted.
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
          INNO_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup download has SHA-256 $hash, expected $env:INNO_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP "innosetup"
          $proc = Start-Process -FilePath $installer -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=$dir"
          if ($proc.ExitCode -ne 0) { throw "Inno Setup install failed with $($proc.ExitCode)" }
          $iscc = Join-Path $dir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe missing under $dir" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          dotnet tool install --global wix --version 6.0.2
          if ($LASTEXITCODE -ne 0) { throw "Could not install WiX 6.0.2" }
          wix --version
        shell: pwsh

      - name: Build the installers
        # The version comes from a vX.Y.Z tag; builds without one get 0.0.<run>.
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $version = if ($env:TAG -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { "0.0.${{ github.run_number }}" }
          $app = (Resolve-Path dist\FlexWeek-Windows).Path
          $out = (Resolve-Path dist).Path
          & $env:ISCC "/DAppVersion=$version" "/DSourceDir=$app" "/DOutputDir=$out" packaging\windows\flexweek.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          wix build packaging\windows\flexweek.wxs -arch x64 -d "Version=$version" -bindpath "app=$app" `
            -o dist\FlexWeek-Windows-x64.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with $LASTEXITCODE" }
          foreach ($name in @("FlexWeek-Windows-x64-Setup.exe", "FlexWeek-Windows-x64.msi")) {
            $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content -NoNewline "dist\$name.sha256"
            Write-Host "$name version $version, $((Get-Item "dist\$name").Length) bytes, SHA-256 $hash"
          }
        shell: pwsh

      - name: Install, open and uninstall each installer
        # 0.9.0 and 0.9.1 shipped a zip whose shortcut pointed at the build
        # machine's folder. Each installer must put a Start menu shortcut that
        # opens the installed FlexWeek.exe, the installed app must pass the
        # setup-Solve smoke test, and uninstall must remove it.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          function Invoke-Checked([string] $file, [string[]] $arguments, [string] $what) {
            $proc = Start-Process -FilePath $file -ArgumentList $arguments -Wait -PassThru
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { throw "$what failed with $($proc.ExitCode)" }
          }
          function Test-Installed([string] $exe, [string] $shortcut, [string] $name) {
            if (-not (Test-Path $exe)) { throw "$name did not install $exe" }
            if (-not (Test-Path $shortcut)) { throw "$name did not create $shortcut" }
            $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
            if ($link.TargetPath -ne $exe) { throw "$name shortcut opens '$($link.TargetPath)', not '$exe'" }
            # Windows Installer resolves a directory with a trailing backslash; Inno does not.
            if ($link.WorkingDirectory.TrimEnd('\') -ne (Split-Path $exe)) {
              throw "$name shortcut starts in '$($link.WorkingDirectory)', not '$(Split-Path $exe)'"
            }
            $report = Join-Path $env:RUNNER_TEMP "$name-smoke.json"
            $proc = Start-Process -FilePath $link.TargetPath -ArgumentList "--smoke-test", $report `
              -WorkingDirectory $link.WorkingDirectory -Wait -PassThru
            if (Test-Path $report) { Get-Content $report }
            $result = if (Test-Path $report) { Get-Content $report -Raw | ConvertFrom-Json } else { $null }
            if ($proc.ExitCode -ne 0 -or -not $result.ok -or $result.stage -ne "week shown after setup Solve") {
              throw "$name installed app failed its smoke test (exit $($proc.ExitCode), stage $($result.stage))"
            }
          }
          function Wait-Removed([string] $path, [string] $name) {
            foreach ($i in 1..60) { if (-not (Test-Path $path)) { return }; Start-Sleep -Seconds 1 }
            throw "$name uninstall left $path behind"
          }

          $setup = Resolve-Path dist\FlexWeek-Windows-x64-Setup.exe
          Invoke-Checked $setup @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER") "Setup.exe install"
          $exe = Join-Path $env:LOCALAPPDATA "Programs\FlexWeek\FlexWeek.exe"
          Test-Installed $exe (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\FlexWeek.lnk") "Setup.exe"
          Invoke-Checked (Join-Path (Split-Path $exe) "unins000.exe") @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") "Setup.exe uninstall"
          Wait-Removed $exe "Setup.exe"

          $msi = (Resolve-Path dist\FlexWeek-Windows-x64.msi).Path
          Invoke-Checked "msiexec.exe" @("/i", "`"$msi`"", "/qn", "/norestart") ".msi install"
          $exe = Join-Path $env:ProgramFiles "FlexWeek\FlexWeek.exe"
          Test-Installed $exe (Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\FlexWeek.lnk") "msi"
          Invoke-Checked "msiexec.exe" @("/x", "`"$msi`"", "/qn", "/norestart") ".msi uninstall"
          Wait-Removed $exe "msi"
        shell: pwsh

      - name: Keep the installers from this run
        if: github.event_name != 'release' && !inputs.tag
        uses: actions/upload-artifact@v4
        with:
          name: FlexWeek-Windows-installers
          path: |
            dist/FlexWeek-Windows-x64-Setup.exe
            dist/FlexWeek-Windows-x64-Setup.exe.sha256
            dist/FlexWeek-Windows-x64.msi
            dist/FlexWeek-Windows-x64.msi.sha256
          retention-days: 7

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$env:TAG" `
            dist\FlexWeek-Windows-x64-Setup.exe `
            dist\FlexWeek-Windows-x64-Setup.exe.sha256 `
            dist\FlexWeek-Windows-x64.msi `
            dist\FlexWeek-Windows-x64.msi.sha256 `
            --clobber

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install bundle tools and xcb helpers to vendor
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            patchelf binutils libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-util1 xvfb \
            libegl1 libgl1 libopengl0 libglx0 libgles2 libgl1-mesa-dri

      - name: Create venv and install build + runtime deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt

      - name: Install Rust and build the engine module
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          .venv/bin/python -m maturin develop --release --manifest-path engine/py/Cargo.toml

      - name: Build and package Linux onedir
        run: |
          ./desktop/build_linux.sh
          ./desktop/package_linux.sh dist/FlexWeek dist/release

      - name: Smoke the packaged archive
        # Prove the download itself starts: extract the tarball a user gets and
        # run the root launcher, not the raw onedir. --smoke-test walks a new
        # account through setup to its first Solve and fails on a blank window.
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ""
        run: |
          mkdir dist/stage
          tar -xzf dist/release/FlexWeek-Linux-x86_64.tar.gz -C dist/stage
          if find dist/stage/FlexWeek dist/FlexWeek -name '*WebEngineCore*' | grep -q .; then
            echo "Native package must not ship WebEngine" >&2
            exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" dist/stage/FlexWeek/FlexWeek --smoke-test dist/packaged-smoke.json
          python -c 'import json,sys; r=json.load(open("dist/packaged-smoke.json")); print(r); sys.exit(0 if r.get("ok") and r.get("stage") == "week shown after setup Solve" else 1)'

      - name: Smoke-test the setup Solve
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ""
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dist/FlexWeek/FlexWeek --smoke-test dist/linux-smoke.json
          python -c 'import json,sys; r=json.load(open("dist/linux-smoke.json")); print(r); sys.exit(0 if r.get("ok") and r.get("stage") == "week shown after setup Solve" else 1)'

      - name: Build AppImage
        # Wraps the same onedir the tarball ships (LSA's packaging method).
        # appimagetool needs desktop-file-validate and mksquashfs; extract-and-
        # run mode avoids needing FUSE on the runner.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            desktop-file-utils squashfs-tools
          chmod +x packaging/make-appimage.sh
          packaging/make-appimage.sh dist/FlexWeek dist/release/FlexWeek-x86_64.AppImage
          test -x dist/release/FlexWeek-x86_64.AppImage
          size=$(stat -c%s dist/release/FlexWeek-x86_64.AppImage)
          echo "AppImage $size bytes"
          test "$size" -gt 1000000

      - name: Check the checksum files
        # Each .sha256 names only its file, so `sha256sum -c` works in whatever
        # folder the user downloaded to. 0.9.0's AppImage checksum held the
        # runner's /home/runner/work/... path instead.
        working-directory: dist/release
        run: |
          cat FlexWeek-Linux-x86_64.tar.gz.sha256 FlexWeek-x86_64.AppImage.sha256
          if grep -q "/" FlexWeek-Linux-x86_64.tar.gz.sha256 FlexWeek-x86_64.AppImage.sha256; then
            echo "A checksum file names a directory (such as /home/runner), not just the file." >&2
            exit 1
          fi
          sha256sum -c FlexWeek-Linux-x86_64.tar.gz.sha256 FlexWeek-x86_64.AppImage.sha256

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/release/FlexWeek-Linux-x86_64.tar.gz \
            dist/release/FlexWeek-Linux-x86_64.tar.gz.sha256 \
            dist/release/FlexWeek-x86_64.AppImage \
            dist/release/FlexWeek-x86_64.AppImage.sha256 \
            --clobber
