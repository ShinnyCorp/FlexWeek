name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Point .venv at the runner's Python
        run: |
          mkdir -p .venv/bin
          ln -s "$pythonLocation/bin/python" .venv/bin/python
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            tools/fwtest/target
            engine/target
          key: fwtest-verify-${{ runner.os }}-${{ hashFiles('tools/fwtest/Cargo.lock', 'engine/Cargo.lock') }}
      - name: fwtest format
        working-directory: tools/fwtest
        run: cargo fmt --check
      - name: fwtest lint
        working-directory: tools/fwtest
        run: cargo clippy -- -D warnings
      - name: fwtest tests
        working-directory: tools/fwtest
        run: cargo test
      - name: Build fwtest
        working-directory: tools/fwtest
        run: |
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: engine format
        working-directory: engine
        run: cargo fmt --check
      - name: engine lint
        working-directory: engine
        run: cargo clippy --workspace -- -D warnings
      - name: engine tests
        working-directory: engine
        run: cargo test --workspace
      - name: Build the engine module
        # pip builds it through maturin (engine/py/pyproject.toml) into the runner's Python, which
        # is not a virtualenv, so `maturin develop` has nowhere to install.
        run: python -m pip install ./engine/py --config-settings=build-args="--features audit"
      - run: fwtest gate --backend-only
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The replay of recorded solves against the original Python solver takes about two
          # minutes on one worker locally and over six here, which ran the default 480 s out.
          FWTEST_STEP_TIMEOUT_SECS: "900"

  rig:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Install display and Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox xdotool x11-utils ffmpeg \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt PySide6==6.11.2
      - name: Point .venv at the runner's Python
        run: |
          mkdir -p .venv/bin
          ln -s "$pythonLocation/bin/python" .venv/bin/python
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            tools/fwtest/target
          key: fwtest-rig-${{ runner.os }}-${{ hashFiles('tools/fwtest/Cargo.lock') }}
      - name: Build fwtest
        working-directory: tools/fwtest
        run: |
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Build the engine module
        run: python -m pip install ./engine/py
      - name: Desktop engine tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          fwtest run --timeout 1800 -- .venv/bin/python -m pytest -q -p no:cacheprovider -n 4 \
            desktop/tests/test_tokens.py \
            desktop/tests/test_update.py
      - name: Run classic Day and Week with a real pointer
        run: |
          set +e
          fwtest rig --server xvfb --design classic --tab day --out rig-artifacts/day
          day_status=$?
          fwtest rig --server xvfb --design classic --tab week --out rig-artifacts/week
          week_status=$?
          if (( day_status || week_status )); then exit 1; fi
          python - <<'PY'
          import json
          from pathlib import Path

          for tab in ("day", "week"):
              results = json.loads((Path("rig-artifacts") / tab / "results.json").read_text())
              if not results:
                  raise SystemExit(f"Classic {tab} rig selected no scenarios")
          PY
      - name: Stop the hidden display
        if: always()
        run: fwtest clean
      - name: Upload rig results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classic-rig
          path: rig-artifacts/
          if-no-files-found: warn
          retention-days: 7

  mutate:
    # workflow_dispatch always. A pull request only when it changes the engine or a mutation spec.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: See whether this pull request changes the engine or a mutation spec
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -Eq '^(engine/|scripts/mutations/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: '3.14'
      - name: Install Qt libraries
        if: steps.changed.outputs.run == 'true'
        # PySide6 cannot load without libEGL; the desktop tests would then fail to import and
        # fwtest would count every mutation they name as caught.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3
      - name: Make the checkout's .venv
        if: steps.changed.outputs.run == 'true'
        # A real virtualenv, not a link to the runner's Python: fwtest rebuilds each mutated engine
        # with `.venv/bin/maturin develop`, which needs maturin there and a virtualenv to install into.
        # 29 of the engine cases name desktop tests. Without PySide6 those tests cannot even
        # import, pytest exits red, and fwtest would count every mutation as caught.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt PySide6==6.11.2
      - name: Install Rust
        if: steps.changed.outputs.run == 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build fwtest
        if: steps.changed.outputs.run == 'true'
        working-directory: tools/fwtest
        run: |
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Build the engine module
        if: steps.changed.outputs.run == 'true'
        run: .venv/bin/maturin develop --release --manifest-path engine/py/Cargo.toml --features audit
      - name: Mutation cases whose rule is in the engine
        if: steps.changed.outputs.run == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: fwtest mutate --engine-only
